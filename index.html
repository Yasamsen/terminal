<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#050505">

<title>YasamGit Manager V3</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    background:#050505;
    color:#ddd;
    font-family:
        Consolas,
        Monaco,
        "Courier New",
        monospace;
}

body{
    overflow:hidden;
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    cursor:not-allowed;
    opacity:.55;
}

.hidden{
    display:none!important;
}


/* =========================
   LOGIN
========================= */

#login{
    width:100%;
    height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.card{
    width:100%;
    max-width:430px;

    background:#0b0b0b;

    border:1px solid #292929;

    border-radius:12px;

    padding:25px;
}

.logo{
    color:#00ff66;

    font-size:22px;

    font-weight:bold;

    margin-bottom:7px;
}

.muted{
    color:#777;

    font-size:12px;

    line-height:1.6;
}

label{
    display:block;

    color:#aaa;

    font-size:12px;

    margin:
        15px
        0
        7px;
}

input,
select{
    width:100%;

    padding:11px;

    background:#111;

    color:#eee;

    border:1px solid #303030;

    border-radius:8px;

    outline:none;
}

input:focus,
select:focus{
    border-color:#00c853;
}

.primary{
    width:100%;

    margin-top:8px;

    padding:12px;

    border:0;

    border-radius:8px;

    background:#00a844;

    color:white;

    font-weight:bold;
}

.primary:hover{
    background:#00c853;
}

#error{
    color:#ff5555;

    font-size:12px;

    margin-top:10px;
}


/* =========================
   APP
========================= */

#app{
    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;
}

.header{
    min-height:58px;

    background:#090909;

    border-bottom:1px solid #222;

    display:flex;

    align-items:center;

    gap:8px;

    padding:
        8px
        12px;

    flex-wrap:wrap;
}

.brand{
    color:#00ff66;

    font-weight:bold;

    margin-right:auto;
}

.repo-select{
    width:250px;

    margin:0;
}

.btn{
    background:#151515;

    color:#ddd;

    border:1px solid #303030;

    border-radius:7px;

    padding:
        8px
        10px;

    transition:
        background .12s,
        transform .08s;
}

.btn:hover{
    background:#222;
}

.btn:active{
    transform:scale(.96);
}

.green{
    color:#00ff66;

    border-color:#075c2d;
}

.red{
    color:#ff6666;
}


/* =========================
   BODY
========================= */

.body{
    display:flex;

    flex:1;

    min-height:0;
}

.sidebar{
    width:240px;

    flex-shrink:0;

    background:#080808;

    border-right:1px solid #222;

    padding:12px;

    overflow:auto;
}

.side-title{
    color:#666;

    font-size:10px;

    margin:
        5px
        0
        8px;
}

.user{
    background:#0d0d0d;

    border:1px solid #222;

    border-radius:8px;

    padding:10px;

    margin-bottom:15px;
}

.user b{
    color:#00ff66;
}

.main{
    flex:1;

    min-width:0;

    display:flex;

    flex-direction:column;
}


/* =========================
   TOOLBAR
========================= */

.toolbar{
    display:flex;

    align-items:center;

    gap:6px;

    padding:8px;

    border-bottom:1px solid #222;

    background:#090909;
}

.path{
    flex:1;

    min-width:0;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

    color:#aaa;
}

.path b{
    color:#00ff66;
}


/* =========================
   FILE LIST
========================= */

.file-list{
    flex:1;

    min-height:0;

    overflow-y:auto;

    overflow-x:hidden;

    padding:
        7px
        7px
        110px;

    -webkit-overflow-scrolling:touch;

    scroll-padding-bottom:110px;
}

.row{
    display:flex;

    align-items:center;

    gap:8px;

    min-height:46px;

    padding:
        10px
        8px;

    border-bottom:1px solid #171717;

    animation:
        show
        .12s
        ease;
}

.row:hover{
    background:#101010;
}

.row:last-child{
    margin-bottom:45px;
}

@keyframes show{

    from{
        opacity:0;

        transform:
            translateY(2px);
    }

    to{
        opacity:1;

        transform:none;
    }

}

.icon{
    width:25px;

    flex-shrink:0;

    text-align:center;
}

.name{
    flex:1;

    min-width:0;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.folder{
    color:#55aaff;

    cursor:pointer;
}

.meta{
    width:75px;

    text-align:right;

    color:#666;

    font-size:11px;
}

.actions{
    display:flex;

    gap:5px;

    flex-shrink:0;
}

.empty,
.loading{
    text-align:center;

    padding:
        50px
        15px;

    color:#666;
}


/* =========================
   FAST REMOVE
========================= */

.row.removing{
    opacity:0;

    transform:
        translateX(20px);

    transition:
        .18s;
}


/* =========================
   LOADING BUTTON
========================= */

.btn.loading{
    pointer-events:none;

    opacity:.55;
}


/* =========================
   STATUS
========================= */

.status{
    position:fixed;

    left:50%;

    bottom:15px;

    transform:
        translateX(-50%);

    background:#111;

    border:1px solid #333;

    border-radius:8px;

    padding:
        10px
        14px;

    z-index:500;

    font-size:12px;

    max-width:90%;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.status.ok{
    color:#00ff66;
}

.status.bad{
    color:#ff5555;
}


/* =========================
   MODAL
========================= */

.modal-bg{
    position:fixed;

    inset:0;

    background:#000c;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:15px;

    z-index:1000;
}

.modal{
    width:100%;

    max-width:750px;

    max-height:92vh;

    overflow:auto;

    background:#0b0b0b;

    border:1px solid #333;

    border-radius:10px;

    padding:15px;
}

.modal-head{
    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:12px;
}

.modal-title{
    color:#00ff66;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

textarea{
    width:100%;

    min-height:400px;

    resize:vertical;

    background:#050505;

    color:#ddd;

    border:1px solid #292929;

    border-radius:7px;

    padding:12px;

    outline:none;
}

.modal-actions{
    display:flex;

    justify-content:flex-end;

    gap:7px;

    margin-top:10px;
}


/* =========================
   PREVIEW
========================= */

.preview-img{
    max-width:100%;

    max-height:70vh;

    display:block;

    margin:auto;

    border-radius:7px;
}

.preview-video{
    width:100%;

    max-height:70vh;

    display:block;
}


/* =========================
   UPLOAD
========================= */

.upload-item{
    padding:8px 0;

    border-bottom:1px solid #222;
}

.progress{
    height:5px;

    background:#222;

    border-radius:5px;

    overflow:hidden;

    margin-top:7px;
}

.progress-bar{
    height:100%;

    width:0;

    background:#00c853;

    transition:.15s;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .sidebar{
        display:none;
    }

    .header{
        padding:8px;
    }

    .repo-select{
        width:220px;
    }

    .meta{
        display:none;
    }

    .actions .btn{
        padding:7px;

        min-width:34px;

        min-height:32px;

        font-size:10px;
    }

    .toolbar{
        overflow-x:auto;

        scrollbar-width:none;
    }

    .toolbar::-webkit-scrollbar{
        display:none;
    }

    .file-list{
        padding-bottom:120px;

        scroll-padding-bottom:120px;
    }

}


/* =========================
   SMALL PHONE
========================= */

@media(max-width:420px){

    .brand{
        width:100%;

        margin-right:0;
    }

    .repo-select{
        flex:1;

        width:auto;
    }

    .header .btn{
        padding:8px;
    }

    .row{
        gap:5px;

        padding:
            9px
            5px;
    }

    .actions{
        gap:3px;
    }

    .actions .btn{
        min-width:30px;

        padding:6px 5px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<div id="login">

    <div class="card">

        <div class="logo">
            &gt; YasamGit Manager V3_
        </div>

        <div class="muted">
            Fast GitHub File Manager
        </div>


        <label>
            GitHub Fine-grained Personal Access Token
        </label>

        <input
            id="tokenInput"
            type="password"
            placeholder="github_token"
            autocomplete="off"
        >


        <button
            id="loginButton"
            class="primary"
        >
            CONNECT GITHUB
        </button>


        <div id="error"></div>


        <p class="muted">
            Token hanya disimpan sementara di
            sessionStorage browser.
        </p>

    </div>

</div>



<!-- =====================================================
     APP
===================================================== -->

<div
    id="app"
    class="hidden"
>


<header class="header">

    <div class="brand">
        &gt; YasamGit_
    </div>


    <select
        id="repoSelect"
        class="repo-select"
    >

        <option value="">
            Pilih repository...
        </option>

    </select>


    <button
        class="btn"
        id="refreshButton"
        title="Refresh"
    >
        ↻
    </button>


    <button
        class="btn red"
        id="logoutButton"
    >
        Logout
    </button>

</header>



<div class="body">


<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside class="sidebar">

    <div class="side-title">
        ACCOUNT
    </div>


    <div class="user">

        <b id="username">
            -
        </b>

        <div
            id="repoCount"
            class="muted"
        >
            -
        </div>

    </div>


    <div class="side-title">
        REPOSITORY
    </div>


    <select id="repoSelectSide">

        <option value="">
            Pilih repository...
        </option>

    </select>

</aside>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">


<div class="toolbar">


    <button
        class="btn"
        id="backButton"
    >
        ←
    </button>


    <button
        class="btn"
        id="homeButton"
    >
        ⌂
    </button>


    <div
        id="path"
        class="path"
    >
        <b>/</b>
    </div>


    <button
        class="btn green"
        id="uploadButton"
    >
        + Upload
    </button>


    <button
        class="btn"

    >
        + Folder
    </button>


</div>



<div
    id="fileList"
    class="file-list"
>

    <div class="empty">
        Pilih repository.
    </div>

</div>


</main>

</div>

</div>



<!-- =====================================================
     UPLOAD MODAL
===================================================== -->

<div
    id="uploadModal"
    class="modal-bg hidden"
>

<div class="modal">


    <div class="modal-head">

        <div class="modal-title">
            Upload Files
        </div>


        <button
            class="btn"
            id="closeUpload"
        >
            ✕
        </button>

    </div>


    <input
        id="uploadInput"
        type="file"
        multiple
    >

    <div class="modal-actions">

        <button
            class="btn"
            id="cancelUpload"
        >
            Cancel
        </button>


        <button

        >
            Upload
        </button>

    </div>

</div>

</div>



<!-- =====================================================
     EDIT MODAL
===================================================== -->

<div
    id="editModal"
    class="modal-bg hidden"
>

<div class="modal">


    <div class="modal-head">

        <div
            id="editTitle"
            class="modal-title"
        >
            Edit
        </div>


        <button
            class="btn"
            id="closeEdit"

            ✕
        </button>

    </div>

    <div class="modal-actions">

        <button
            class="btn"
            id="cancelEdit"
        >
            Cancel
        </button>


        <button
            class="btn green"
            id="saveEdit"
        >
            Save / Update
        </button>

    </div>

</div>

</div>



<!-- =====================================================
     PREVIEW MODAL
===================================================== -->

<div
    id="previewModal"
    class="modal-bg hidden"
>

<div class="modal">


    <div class="modal-head">

        <div
            id="previewTitle"
            class="modal-title"
        >
            Preview
        </div>


        <button
            class="btn"
            id="closePreview"
        >
            ✕
        </button>

    </div>


    <div id="previewContent"></div>

</div>

</div>



<!-- =====================================================
     STATUS
===================================================== -->

<div
    id="status"
    class="status hidden"
></div>



<script>


/* =====================================================
   CONFIG
===================================================== */

const API =
    "https://api.github.com";


/* =====================================================
   STATE
===================================================== */

let token =
    sessionStorage.getItem(
        "yasam_github_token"
    );

let repositories = [];

let currentRepo = null;

let currentPath = "";

let editingFile = null;


/* =====================================================
   ELEMENTS
===================================================== */

const loginPage =
    document.getElementById(
        "login"
    );

const app =
    document.getElementById(
        "app"
    );

const tokenInput =
    document.getElementById(
        "tokenInput"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const errorBox =
    document.getElementById(
        "error"
    );

const repoSelect =
    document.getElementById(
        "repoSelect"
    );

const repoSelectSide =
    document.getElementById(
        "repoSelectSide"
    );

const fileList =
    document.getElementById(
        "fileList"
    );

const pathBox =
    document.getElementById(
        "path"
    );

const statusBox =
    document.getElementById(
        "status"
    );


/* =====================================================
   BUTTON LOADING
===================================================== */

function buttonLoading(
    button,
    loading = true
){

    if(!button){
        return;
    }


    if(loading){

        if(
            !button.dataset.originalText
        ){

            button.dataset.originalText =
                button.innerHTML;

        }

        button.disabled =
            true;

        button.classList.add(
            "loading"
        );

        button.innerHTML =
            "...";

    }else{

        button.disabled =
            false;

        button.classList.remove(
            "loading"
        );

        button.innerHTML =
            button.dataset.originalText ||
            "";

        delete button.dataset.originalText;

    }

}


/* =====================================================
   GITHUB API
===================================================== */

async function github(
    endpoint,
    options = {}
){

    const response =
        await fetch(
            API + endpoint,
            {
                method:
                    options.method ||
                    "GET",

                headers:{
                    "Accept":
                        "application/vnd.github+json",

                    "Authorization":
                        "Bearer " +
                        (
                            options.token ||
                            token
                        ),

                    "X-GitHub-Api-Version":
                        "2022-11-28",

                    "Content-Type":
                        "application/json"
                },

                body:
                    options.body
                    ? JSON.stringify(
                        options.body
                    )
                    : null
            }
        );


    let data = {};


    try{

        data =
            await response.json();

    }catch{}


    if(!response.ok){

        throw new Error(
            data.message ||
            "GitHub API Error " +
            response.status
        );

    }


    return data;

}


/* =====================================================
   LOGIN
===================================================== */

loginButton.onclick =
    login;


tokenInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "Enter"
        ){

            login();

        }

    }
);


async function login(){

const value =
tokenInput.value.trim();


if(!value){

errorBox.textContent =
"Token wajib diisi.";

return;

}


loginButton.disabled=true;

loginButton.textContent =
"CONNECTING...";

errorBox.textContent="";


try{

const user =
await github(
"/user",
{
token:value
}
);


token=value;

sessionStorage.setItem(
"yasam_github_token",
token
);


loginPage.classList.add(
"hidden"
);

app.classList.remove(
"hidden"
);


document.getElementById(
"username"
).textContent =
user.login;


await loadRepositories();


}catch(error){

errorBox.textContent =
error.message;

}finally{

loginButton.disabled=false;

loginButton.textContent =
"CONNECT GITHUB";

}

}

/* =====================================================
   AUTO LOGIN
===================================================== */

if(token){

    autoLogin();

}


async function autoLogin(){

    try{

        const user =
            await github(
                "/user"
            );


        loginPage.classList.add(
            "hidden"
        );

        app.classList.remove(
            "hidden"
        );


        document.getElementById(
            "username"
        ).textContent =
            user.login;


        await loadRepositories();


    }catch{

        sessionStorage.removeItem(
            "yasam_github_token"
        );

        token = null;

    }

}


/* =====================================================
   LOAD REPOSITORIES
===================================================== */

async function loadRepositories(){

    repositories = [];


    for(
        let page = 1;
        page <= 10;
        page++
    ){

        const data =
            await github(
                `/user/repos?per_page=100&page=${page}&sort=updated`
            );


        repositories.push(
            ...data
        );


        if(
            data.length < 100
        ){

            break;

        }

    }


    repoSelect.innerHTML =
        `
        <option value="">
            Pilih repository...
        </option>
        `;


    repoSelectSide.innerHTML =
        `
        <option value="">
            Pilih repository...
        </option>
        `;


    repositories.forEach(
        repo => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                repo.full_name;


            option.textContent =
                repo.name +
                (
                    repo.private
                    ? " 🔒"
                    : ""
                );


            repoSelect.appendChild(
                option
            );


            repoSelectSide.appendChild(
                option.cloneNode(true)
            );

        }
    );


    document.getElementById(
        "repoCount"
    ).textContent =
        repositories.length +
        " repository";

}


/* =====================================================
   SELECT REPOSITORY
===================================================== */

repoSelect.onchange =
    () => {

        repoSelectSide.value =
            repoSelect.value;

        selectRepository(
            repoSelect.value
        );

    };


repoSelectSide.onchange =
    () => {

        repoSelect.value =
            repoSelectSide.value;

        selectRepository(
            repoSelectSide.value
        );

    };


async function selectRepository(
    name
){

    if(!name){

        currentRepo = null;

        currentPath = "";

        fileList.innerHTML =
            `
            <div class="empty">
                Pilih repository.
            </div>
            `;

        return;

    }


    currentRepo =
        repositories.find(
            repo =>
                repo.full_name ===
                name
        );


    currentPath = "";


    await loadFiles();

}


/* =====================================================
   GITHUB PATH
===================================================== */

function githubPath(
    path = ""
){

    const owner =
        encodeURIComponent(
            currentRepo.owner.login
        );


    const repo =
        encodeURIComponent(
            currentRepo.name
        );


    const encoded =
        path
            .split("/")
            .filter(Boolean)
            .map(
                encodeURIComponent
            )
            .join("/");


    return (
        `/repos/${owner}/${repo}/contents/` +
        encoded
    );

}


/* =====================================================
   JOIN PATH
===================================================== */

function joinPath(
    ...parts
){

    return parts
        .filter(Boolean)
        .join("/")
        .replace(
            /\/+/g,
            "/"
        )
        .replace(
            /^\//,
            ""
        );

}


/* =====================================================
   UPDATE PATH
===================================================== */

function updatePath(){

    pathBox.innerHTML =
        "<b>/</b> " +
        escapeHtml(
            currentPath
        );

}


/* =====================================================
   LOAD FILES
===================================================== */

async function loadFiles(){

    if(!currentRepo){

        return;

    }


    updatePath();


    fileList.innerHTML =
        `
        <div class="loading">
            Loading...
        </div>
        `;


    try{

        let files =
            await github(
                githubPath(
                    currentPath
                ) +
                "?ref=" +
                encodeURIComponent(
                    currentRepo.default_branch
                )
            );


        if(
            !Array.isArray(files)
        ){

            files = [
                files
            ];

        }


        files.sort(
            (a,b) => {

                if(
                    a.type ===
                    b.type
                ){

                    return a.name
                        .localeCompare(
                            b.name
                        );

                }


                return (
                    a.type ===
                    "dir"
                )
                ? -1
                : 1;

            }
        );


        renderFiles(
            files
        );


    }catch(error){

        fileList.innerHTML =
            `
            <div class="empty">
                ${escapeHtml(
                    error.message
                )}
            </div>
            `;

    }

}


/* =====================================================
   RENDER FILES
===================================================== */

function renderFiles(
    files
){

    fileList.innerHTML =
        "";


    if(currentPath){

        const row =
            document.createElement(
                "div"
            );


        row.className =
            "row";


        row.innerHTML =
            `
            <div class="icon">
                ↩
            </div>

            <div class="name folder">
                ..
            </div>
            `;


        row.querySelector(
            ".name"
        ).onclick =
            goBack;


        fileList.appendChild(
            row
        );

    }


    if(!files.length){

        fileList.innerHTML +=
            `
            <div class="empty">
                Folder kosong.
            </div>
            `;

        return;

    }


    files.forEach(
        file => {

            fileList.appendChild(
                createRow(
                    file
                )
            );

        }
    );

}

function createRow(

){

    const row =
        document.createElement(
            "div"
        );


    row.className =
        "row";


    row.dataset.path =
        file.path;


    const folder =
        file.type === "dir";


    row.innerHTML =
        `

        <div class="icon">

            ${
                folder
                ? "📁"
                : fileIcon(
                    file.name
                )
            }

        </div>


        <div
            class="name ${
                folder
                ? "folder"
                : ""
            }"
        >

            ${escapeHtml(
                file.name
            )}

        </div>


        <div class="meta">

            ${
                folder
                ? "-"
                : formatBytes(
                    file.size || 0
                )
            }

        </div>


        <div class="actions">


            ${
                !folder

                >

        </div>

        `;


    if(folder){

        row.querySelector(
            ".name"
        ).onclick =
            () => {

                currentPath =
                    joinPath(
                        currentPath,
                        file.name
                    );

                loadFiles();

            };

    }else{

        row.querySelector(
            ".view"
        ).onclick =
            event => {

                preview(
                    file,
                    event.currentTarget
                );

            };


        row.querySelector(
            ".edit"
        ).onclick =
            event => {

                editFile(
                    file,
                    event.currentTarget
                );

            };


        row.querySelector(
            ".download"
        ).onclick =
            event => {

                downloadFile(
                    file,
                    event.currentTarget
                );

            };

    }


    row.querySelector(
        ".rename"
    ).onclick =
        event => {

            renameFile(
                file,

                event.currentTarget
            );

        };


    row.querySelector(
        ".delete"
    ).onclick =
        event => {

            deleteFile(
                file,
                row,
                event.currentTarget
            );

        };


    return row;

async function deleteFile(
    file,
    row,
    button
){

    if(
        !confirm(
            `Hapus "${file.name}"?`
        )
    ){

        return;

    }


    buttonLoading(
        button
    );


    /*
     * Hilangkan langsung dari UI.

    );


    setTimeout(
        () => {

            if(row.parentNode){

                row.remove();

            }

        },
        180
    );


    try{

        if(
            file.type ===
            "dir"
        ){

            await deleteFolder(
                file.path
            );

        }else{

            await github(
                githubPath(
                    file.path
                ),
                {
                    method:"DELETE",

                    body:{

                        message:
                            "Delete " +
                            file.path,

                        sha:
                            file.sha,

                        branch:

                                .default_branch

                }
            );

        status(

/* =====================================================
   RENAME
===================================================== */

async function renameFile(
    file,
    row,
    button
){

    const newName =
        prompt(
            "Nama baru:",
            file.name
        );


    if(
        !newName ||
        newName ===
        file.name
    ){

        return;

    }


    if(
        newName.includes("/") ||
        newName.includes("\\")
    ){

        status(
            "Nama file tidak valid.",
            "bad"
        );

        return;

    }


    const oldPath =
        file.path;


    const newPath =
        joinPath(
            currentPath,
            newName
        );


    buttonLoading(
        button
    );


    try{

        if(
            file.type ===
            "dir"
        ){

            await copyFolder(
                oldPath,
                newPath
            );


            await deleteFolder(
                oldPath
            );

        }else{

            const data =
                await github(
                    githubPath(
                        oldPath
                    )
                );


            const body = {

                message:
                    `Rename ${oldPath} to ${newPath}`,

                content:
                    data.content.replace(
                        /\n/g,
                        ""
                    ),

                branch:
                    currentRepo
                        .default_branch

            };


            let target = null;


            try{

                target =
                    await github(
                        githubPath(
                            newPath
                        )
                    );

            }catch{}


            if(
                target?.sha
            ){

                body.sha =
                    target.sha;

            }


            await github(
                githubPath(
                    newPath
                ),
                {
                    method:"PUT",
                    body
                }
            );


            await github(
                githubPath(
                    oldPath
                ),
                {
                    method:"DELETE",

                    body:{

                        message:
                            "Delete old " +
                            oldPath,

                        sha:
                            file.sha,

                        branch:
                            currentRepo
                                .default_branch

                    }
                }
            );

        }


        /*
         * UI langsung diperbarui.
         */

        const nameElement =
            row.querySelector(
                ".name"
            );


        nameElement.textContent =
            newName;


        row.dataset.path =
            newPath;


        status(
            "✓ Rename berhasil.",
            "ok"
        );


        /*
         * Sinkronisasi background.
         */

        setTimeout(
            () => {

                if(
                    currentRepo
                ){

                    loadFiles();

                }

            },
            1000
        );


    }catch(error){

        status(
            "Rename gagal: " +
            error.message,
            "bad"
        );


        await loadFiles();

    }finally{

        buttonLoading(
            button,
            false
        );

    }

}

/* =====================================================
   UPLOAD FILE
===================================================== */

async function uploadFile(
    file,
    index
){

    try{

        status(
            "Uploading " +
            file.name +
            "..."
        );


        const buffer =
            await file.arrayBuffer();


        const content =
            arrayBufferToBase64(
                buffer
            );


        const target =
            joinPath(
                currentPath,
                file.name
            );


        let existing = null;


        try{

            existing =
                await github(
                    githubPath(
                        target
                    ) +
                    "?ref=" +
                    encodeURIComponent(
                        currentRepo
                            .default_branch
                    )
                );

        }catch(error){

            if(
                !(
                    error.message
                        .includes(
                            "Not Found"
                        ) ||
                    error.message
                        .includes(
                            "404"
                        )
                )
            ){

                throw error;

            }

        }


        const body = {

            message:
                existing
                ? "Update " + target
                : "Upload " + target,

            content,

            branch:
                currentRepo
                    .default_branch

        };


        /*
         * Kalau sudah ada,
         * otomatis ditimpa.
         */

        if(
            existing?.sha
        ){

            body.sha =
                existing.sha;

        }


        await github(
            githubPath(
                target
            ),
            {
                method:"PUT",
                body
            }
        );


        const progress =
            document.getElementById(
                "progress" +
                index
            );


        if(progress){

            progress.style.width =
                "100%";

        }


        status(
            "✓ " +
            file.name +
            (
                existing
                ? " ditimpa."
                : " diupload."
            ),
            "ok"
        );


    }catch(error){

        status(
            "Upload gagal: " +
            error.message,
            "bad"
        );

    }

}

/* =====================================================
   DOWNLOAD
===================================================== */

async function downloadFile(
    file,
    button
){

    buttonLoading(
        button
    );


    try{

        const data =
            await github(
                githubPath(
                    file.path
                )
            );


        const binary =
            atob(
                data.content.replace(
                    /\n/g,
                    ""
                )
            );


        const bytes =
            new Uint8Array(
                binary.length
            );


        for(
            let i = 0;
            i < binary.length;
            i++
        ){

            bytes[i] =
                binary.charCodeAt(i);

        }


        const blob =
            new Blob(
                [bytes],
                {
                    type:
                        "application/octet-stream"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const a =
            document.createElement(
                "a"
            );


        a.href =
            url;


        a.download =
            file.name;


        document.body.appendChild(
            a
        );


        a.click();


        a.remove();


        setTimeout(
            () => {

                URL.revokeObjectURL(
                    url
                );

            },
            1000
        );


        status(
            "✓ Download dimulai.",
            "ok"
        );


    }catch(error){

        status(
            "Download gagal: " +
            error.message,
            "bad"
        );

    }finally{

        buttonLoading(
            button,
            false
        );

    }

}

/* =====================================================
   BASE64 TEXT
===================================================== */

function textToBase64(
    text
){

    return arrayBufferToBase64(
        new TextEncoder()
            .encode(
                text
            )
            .buffer
    );

}


/* =====================================================
   BASE64 TO TEXT
===================================================== */

function base64ToText(
    base64
){

    const binary =
        atob(
            base64.replace(
                /\n/g,
                ""
            )
        );


    const bytes =
        new Uint8Array(
            binary.length
        );


    for(
        let i = 0;
        i < binary.length;
        i++
    ){

        bytes[i] =
            binary.charCodeAt(i);

    }


    return new TextDecoder()
        .decode(
            bytes
        );

}


/* =====================================================
   ARRAY BUFFER TO BASE64
===================================================== */

function arrayBufferToBase64(
    buffer
){

    const bytes =
        new Uint8Array(
            buffer
        );


    let binary =
        "";


    const chunk =
        0x8000;


    for(
        let i = 0;
        i < bytes.length;
        i += chunk
    ){

        binary +=
            String.fromCharCode(
                ...bytes.subarray(
                    i,
                    Math.min(
                        i + chunk,
                        bytes.length
                    )
                )
            );

    }


    return btoa(
        binary
    );

}


/* =====================================================
   FORMAT BYTES
===================================================== */

function formatBytes(
    bytes
){

    if(!bytes){

        return "0 B";

    }


    const units =
        [
            "B",
            "KB",
            "MB",
            "GB"
        ];


    const index =
        Math.min(
            3,
            Math.floor(
                Math.log(
                    bytes
                ) /
                Math.log(
                    1024
                )
            )
        );


    return (
        bytes /
        Math.pow(
            1024,
            index
        )
    ).toFixed(
        index === 0
        ? 0
        : 1
    ) +
    " " +
    units[index];

}

function fileIcon(

){

            .toLowerCase();

        js:"📜",

        json:"🧾",

        html:"🌐",

        css:"🎨",

        py:"🐍",

        php:"🐘",

        md:"📝",

        txt:"📄",

        jpg:"🖼️",

        jpeg:"🖼️",

        png:"🖼️",

        gif:"🖼️",

        webp:"🖼️",

        mp4:"🎬",

        webm:"🎬",

        ogg:"🎬",

        zip:"📦",

        rar:"📦",

        apk:"📦",

        pdf:"📕"

    };

    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    value
){

    return String(
        value
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   STATUS
===================================================== */

let statusTimer;


function status(
    message,
    type = ""
){

    clearTimeout(
        statusTimer
    );


    statusBox.textContent =
        message;


    statusBox.className =
        "status " +
        type;


    statusTimer =
        setTimeout(
            () => {

                statusBox.classList.add(
                    "hidden"
                );

            },
            3500
        );

}
