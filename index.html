<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>YasamGit V5</title>

<style>
*{
    box-sizing:border-box;
}

html{
    background:#050505;
}

body{
    margin:0;
    min-width:0;
    min-height:100%;
    background:#050505;
    color:#ddd;
    font-family:
        Consolas,
        Monaco,
        "Courier New",
        monospace;
    overflow-x:hidden;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    cursor:not-allowed;
}

.hidden{
    display:none!important;
}

.app{
    width:100%;
    min-height:100vh;
}

/* =====================================================
LOGIN
===================================================== */

.login-page{
    min-height:100svh;
    min-height:100dvh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:
        max(20px,env(safe-area-inset-top))
        16px
        max(20px,env(safe-area-inset-bottom));

    background:#050505;
}

.login-card{
    width:100%;
    max-width:430px;

    background:#0b0b0b;

    border:1px solid #292929;
    border-radius:14px;

    padding:24px;

    box-shadow:0 20px 70px rgba(0,0,0,.7);
}

.logo{
    color:#00ff66;
    font-size:25px;
    font-weight:bold;
}

.version{
    color:#555;
    font-size:11px;
    margin-top:5px;
    margin-bottom:22px;
}

label{
    display:block;
    color:#888;
    font-size:11px;
    margin:12px 0 6px;
}

input,
textarea,
select{
    width:100%;

    background:#111;
    color:#eee;

    border:1px solid #303030;
    border-radius:8px;

    padding:11px;

    outline:none;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#00c853;
}

textarea{
    min-height:120px;
    resize:vertical;
}

.btn{
    min-height:38px;

    background:#111;
    color:#ddd;

    border:1px solid #333;
    border-radius:8px;

    padding:8px 12px;
}

.btn:hover{
    background:#202020;
}

.primary{
    background:#008f3f;
    border-color:#00c853;
    color:#fff;
}

.primary:hover{
    background:#00b84f;
}

.danger{
    border-color:#552222;
}

.loading{
    opacity:.55;
    pointer-events:none;
}

.login-button{
    width:100%;
    margin-top:15px;
}

.login-status{
    margin-top:12px;
    font-size:12px;
    line-height:1.5;
}

.success{
    color:#00ff66;
}

.error{
    color:#ff5555;
}

.note{
    color:#666;
    font-size:10px;
    line-height:1.6;
    margin-top:12px;
}


/* =====================================================
HEADER
===================================================== */

.header{
    position:sticky;
    top:0;
    z-index:20;

    width:100%;

    display:flex;
    align-items:center;
    gap:8px;

    min-height:58px;

    padding:
        8px
        12px;

    padding-top:
        max(8px,env(safe-area-inset-top));

    background:#090909;
    border-bottom:1px solid #222;
}

.brand{
    color:#00ff66;
    font-weight:bold;
    margin-right:auto;
}

.user{
    color:#777;
    font-size:11px;
    max-width:120px;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}


/* =====================================================
MAIN
===================================================== */

.container{
    width:100%;
    max-width:1150px;

    margin:auto;

    padding:
        12px
        12px
        calc(70px + env(safe-area-inset-bottom));
}

.card{
    width:100%;

    background:#0b0b0b;
    border:1px solid #252525;
    border-radius:12px;

    padding:13px;
    margin-bottom:12px;
}


/* =====================================================
TOOLBAR
===================================================== */

.toolbar{
    display:flex;
    align-items:center;
    gap:8px;

    width:100%;
}

.toolbar input{
    min-width:0;
    flex:1;
}


/* =====================================================
REPO
===================================================== */

.repo-grid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:10px;
}

.repo{
    min-width:0;

    background:#080808;
    border:1px solid #252525;
    border-radius:10px;

    padding:13px;
}

.repo-name{
    color:#00ff66;
    font-weight:bold;

    overflow-wrap:anywhere;
}

.repo-desc{
    color:#777;
    font-size:11px;
    line-height:1.5;

    margin-top:7px;

    min-height:32px;

    overflow-wrap:anywhere;
}

.repo-meta{
    color:#555;
    font-size:10px;

    margin-top:9px;
}

.repo-actions{
    display:flex;
    gap:6px;

    margin-top:10px;
}

.repo-actions .btn{
    flex:1;
}


/* =====================================================
FILE
===================================================== */

.file-header{
    display:flex;
    align-items:center;
    gap:8px;

    min-width:0;
    margin-bottom:10px;
}

.current-repo{
    min-width:0;

    color:#00ff66;
    font-weight:bold;

    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.path-bar{
    display:flex;
    align-items:center;
    gap:5px;

    overflow-x:auto;

    padding:7px 0;

    scrollbar-width:none;
}

.path-bar::-webkit-scrollbar{
    display:none;
}

.path-button{
    flex-shrink:0;

    border:0;
    background:transparent;
    color:#888;

    padding:5px;
}

.path-button:last-child{
    color:#00ff66;
}

.file-list{
    width:100%;
}

.file{
    display:flex;
    align-items:center;
    gap:9px;

    width:100%;

    background:#080808;
    border:1px solid #222;
    border-radius:9px;

    padding:10px;

    margin-bottom:7px;
}

.file-icon{
    width:30px;
    min-width:30px;

    text-align:center;
    font-size:18px;
}

.file-main{
    min-width:0;
    flex:1;
}

.file-name{
    color:#ddd;

    overflow-wrap:anywhere;
}

.file-meta{
    color:#666;
    font-size:10px;

    margin-top:4px;
}

.file-actions{
    display:flex;
    align-items:center;
    gap:5px;

    flex-shrink:0;
}

.file-actions .btn{
    min-width:37px;
    padding:7px 9px;
}


/* =====================================================
EMPTY
===================================================== */

.empty{
    width:100%;

    color:#666;
    text-align:center;

    padding:35px 10px;

    overflow-wrap:anywhere;
}


/* =====================================================
MODAL
===================================================== */

.modal-bg{
    position:fixed;
    inset:0;

    z-index:100;

    display:flex;
    align-items:flex-start;
    justify-content:center;

    overflow-y:auto;

    padding:
        max(18px,env(safe-area-inset-top))
        14px
        max(18px,env(safe-area-inset-bottom));

    background:rgba(0,0,0,.78);
}

.modal{
    width:100%;
    max-width:560px;

    margin:auto 0;

    background:#0b0b0b;

    border:1px solid #333;
    border-radius:12px;

    padding:16px;

    max-height:
        calc(100svh - 30px);

    max-height:
        calc(100dvh - 30px);

    overflow-y:auto;
}

.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;

    margin-bottom:8px;
}

.modal-title{
    color:#00ff66;
    font-weight:bold;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:7px;

    margin-top:15px;
}

.preview-content{
    width:100%;
    max-height:65vh;

    background:#050505;
    border-radius:8px;

    overflow:auto;
}

.preview-image{
    display:block;

    max-width:100%;
    max-height:65vh;

    margin:auto;
}

.preview-video{
    display:block;

    width:100%;
    max-height:65vh;
}

.preview-text{
    margin:0;

    padding:12px;

    color:#ddd;

    white-space:pre-wrap;
    overflow-wrap:anywhere;

    font-family:inherit;
    font-size:12px;

    max-height:65vh;
    overflow:auto;
}


/* =====================================================
STATUS
===================================================== */

#status{
    position:fixed;

    left:50%;
    bottom:
        max(14px,env(safe-area-inset-bottom));

    transform:translateX(-50%);

    z-index:200;

    width:max-content;
    max-width:calc(100% - 28px);

    background:#111;

    border:1px solid #333;
    border-radius:8px;

    padding:10px 14px;

    font-size:11px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    box-shadow:0 10px 40px #000;
}


/* =====================================================
MOBILE
===================================================== */

@media(max-width:700px){

    .container{
        padding-left:9px;
        padding-right:9px;

        padding-bottom:
            calc(
                85px +
                env(safe-area-inset-bottom)
            );
    }

    .card{
        border-radius:10px;
    }

    .repo-grid{
        grid-template-columns:1fr;
    }

    .header{
        flex-wrap:wrap;
    }

    .brand{
        width:100%;
        margin-right:0;
    }

    .user{
        margin-right:auto;
    }

    .toolbar{
        flex-wrap:wrap;
    }

    .toolbar input{
        width:100%;
        flex:none;
    }

    .toolbar .btn{
        flex:1;
    }

    .file{
        flex-wrap:wrap;
        align-items:flex-start;
    }

    .file-main{
        width:
            calc(100% - 45px);
        flex:none;
    }

    .file-actions{
        width:100%;
    }

    .file-actions .btn{
        flex:1;
    }

    .modal{
        margin:auto 0;
    }
}
</style>
</head>


<body>


<!-- =====================================================
LOGIN
===================================================== -->

<section
    id="loginPage"
    class="login-page"
>

<div class="login-card">

<!-- =====================================================
APP
===================================================== -->

>

<!-- =====================================================
STATUS
===================================================== -->

<div
    id="status"
    class="hidden"
></div>



<script>

/* =====================================================
CONFIG
===================================================== */

const API =
    "https://api.github.com";

const SESSION_KEY =
    "yasamgit_v5_token";


/* =====================================================
STATE
===================================================== */

let token = "";

let githubUser = null;

let repositories = [];

let selectedRepo = null;

let files = [];

let currentPath = "";

let selectedFile = null;

let statusTimer = null;


/* =====================================================
HELPERS
===================================================== */

function $(id){

    return document.getElementById(id);

}


function esc(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function sleep(ms){

    return new Promise(
        resolve =>
            setTimeout(resolve,ms)
    );

}


/* =====================================================
STATUS
===================================================== */

function showStatus(
    message,
    ok=true
){

    const box =
        $("status");


    clearTimeout(
        statusTimer
    );


    box.textContent =
        message;


    box.className =
        ok
        ? "ok"
        : "bad";


    box.classList.remove(
        "hidden"
    );


    statusTimer =
        setTimeout(
            () => {

                box.classList.add(
                    "hidden"
                );

            },
            3500
        );

}


/* =====================================================
GITHUB API
===================================================== */

async function github(
    endpoint,
    options={}
){

    if(!token){

        throw new Error(
            "Session GitHub tidak tersedia."
        );

    }


    const response =
        await fetch(
            API + endpoint,
            {

                method:
                    options.method ||
                    "GET",

                headers:{

                    "Authorization":
                        "Bearer " + token,

                    "Accept":
                        "application/vnd.github+json",

                    "X-GitHub-Api-Version":
                        "2022-11-28",

                    "Content-Type":
                        "application/json"

                },

                body:
                    options.body !== undefined
                    ? JSON.stringify(
                        options.body
                    )
                    : undefined

            }
        );


    let data = null;


    try{

        data =
            await response.json();

    }catch{

        data =
            null;

    }


    if(!response.ok){

        if(
            response.status === 401
        ){

            throw new Error(
                "Token tidak valid atau sudah expired."
            );

        }


        throw new Error(
            data?.message ||
            `GitHub API error ${response.status}`
        );

    }


    return data;

}


/* =====================================================
LOGIN
===================================================== */

$("loginButton").onclick =
    login;


$("tokenInput").addEventListener(
    "keydown",
    e => {

        if(
            e.key === "Enter"
        ){

            login();

        }

    }
);


async function login(){

    const button =
        $("loginButton");

    const status =
        $("loginStatus");

    const entered =
        $("tokenInput")
            .value
            .trim();


    if(!entered){

        status.className =
            "login-status error";

        status.textContent =
            "Masukkan GitHub token.";

        return;

    }


    button.classList.add(
        "loading"
    );

    button.textContent =
        "...";


    status.className =
        "login-status";

    status.textContent =
        "... Memvalidasi token";


    const previous =
        token;


    token =
        entered;


    try{

        githubUser =
            await github(
                "/user"
            );


        sessionStorage.setItem(
            SESSION_KEY,
            entered
        );


        status.className =
            "login-status success";

        status.textContent =
            "✓ Login berhasil";


        await sleep(250);


        $("tokenInput").value =
            "";


        showApp();


    }catch(error){

        token =
            previous ||
            "";

        sessionStorage.removeItem(
            SESSION_KEY
        );


        status.className =
            "login-status error";

        status.textContent =
            error.message;

    }finally{

        button.classList.remove(
            "loading"
        );

        button.textContent =
            "LOGIN WITH GITHUB";

    }

}


/* =====================================================
RESTORE SESSION
===================================================== */

async function restoreSession(){

    const saved =
        sessionStorage.getItem(
            SESSION_KEY
        );


    if(!saved){

        return;

    }


    token =
        saved;


    try{

        githubUser =
            await github(
                "/user"
            );


        showApp();


    }catch{

        logout();

    }

}


/* =====================================================
SHOW APP
===================================================== */

function showApp(){

    $("loginPage")
        .classList
        .add("hidden");


    $("app")
        .classList
        .remove("hidden");


    $("currentUser")
        .textContent =
        "@" +
        (
            githubUser?.login ||
            "github"
        );


    showRepos();

}


/* =====================================================
LOGOUT
===================================================== */

$("logoutButton").onclick =
    logout;


function logout(){

    sessionStorage.removeItem(
        SESSION_KEY
    );

    token =
        "";

    githubUser =
        null;

    repositories =
        [];

    selectedRepo =
        null;

    files =
        [];

function renderPath(){

    const bar =
        $("pathBar");


    bar.innerHTML =
        "";


    const root =
        document.createElement(
            "button"
        );


    root.className =
        "path-button";

                "";

            renderFiles();

        };


    bar.appendChild(
        root
    );


    if(!currentPath){

        return;

    }


    const parts =
        currentPath
            .split("/")

        "";


    parts.forEach(
        part => {

            accumulated +=
                (
                    accumulated
                    ? "/"
                    : ""
                ) +
                part;


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "path-button";


            button.textContent =
                "› " + part;


            const target =
                accumulated;


            button.onclick =
                () => {

                    currentPath =
                        target;

                    renderPath();
                    renderFiles();

                };


            bar.appendChild(
                button
            );

        }
    );

/* =====================================================
FILE ICON
===================================================== */

function iconFor(
    name,
    folder=false
){

    if(folder){

        return "📁";

    }


    const ext =
        name
            .split(".")
            .pop()
            .toLowerCase();


    if(
        [
            "jpg",
            "jpeg",
            "png",
            "gif",
            "webp",
            "bmp",
            "svg"
        ].includes(ext)
    ){

        return "🖼️";

    }


    if(
        [
            "mp4",
            "webm",
            "mov",
            "mkv",
            "avi"
        ].includes(ext)
    ){

        return "🎬";

    }


    if(
        [
            "mp3",
            "wav",
            "ogg"
        ].includes(ext)
    ){

        return "🎵";

    }


    if(
        [
            "zip",
            "rar",
            "7z",
            "tar",
            "gz"
        ].includes(ext)
    ){

        return "📦";

    }


    if(
        [
            "js",
            "ts",
            "html",
            "css",
            "json",
            "php",
            "py",
            "java",
            "c",
            "cpp",
            "sh"
        ].includes(ext)
    ){

        return "💻";

    }


    return "📄";

}


/* =====================================================
SIZE
===================================================== */

function sizeText(
    size
){

    if(size < 1024){

        return size + " B";

    }


    if(
        size <
        1024 * 1024
    ){

        return (
            size / 1024
        ).toFixed(1) +
        " KB";

    }


    return (
        size /
        1024 /
        1024
    ).toFixed(1) +
    " MB";

}


/* =====================================================
DIRECT CHILD FOLDERS
===================================================== */

function getFolders(){

    const prefix =
        currentPath
        ? currentPath + "/"
        : "";


    const set =
        new Set();


    files.forEach(
        file => {

            if(
                !file.path.startsWith(
                    prefix
                )
            ){

                return;

            }


            const rest =
                file.path.slice(
                    prefix.length
                );


            const slash =
                rest.indexOf(
                    "/"
                );


            if(
                slash !== -1
            ){

                set.add(
                    rest.slice(
                        0,
                        slash
                    )
                );

            }

        }
    );


    return [...set].sort();

}


/* =====================================================
RENDER FILES
===================================================== */

function renderFiles(){

    const box =
        $("fileList");


    const search =
        $("fileSearch")
            .value
            .trim()
            .toLowerCase();


    const prefix =
        currentPath
        ? currentPath + "/"
        : "";


    const folders =
        getFolders();


    const visibleFiles =
        files.filter(
            file => {

                if(
                    !file.path.startsWith(
                        prefix
                    )
                ){

                    return false;

                }


                const rest =
                    file.path.slice(
                        prefix.length
                    );


                if(
                    rest.includes("/")
                ){

                    return false;

                }


                return rest
                    .toLowerCase()
                    .includes(search);

            }
        );


    box.innerHTML =
        "";


    folders
        .filter(
            folder =>
                folder
                    .toLowerCase()
                    .includes(search)
        )
        .forEach(
            folder => {

                const div =
                    document.createElement(

                            folder;

                        $("fileSearch").value =
                            "";

                        renderPath();
                        renderFiles();

                    };


                box.appendChild(
                    div

            }
        );


    visibleFiles.forEach(
        file => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "file";


            div.dataset.path =
                file.path;


            const editable =

                );


            div.innerHTML =

                    <button
                        class="btn preview-btn"
                    >
                        👁️
                    </button>

                    ${
                        editable
                        ? `
                        <button
                            class="btn edit-btn"
                        >
                            ✍️
                        </button>
                        `
                        : ""
                    }

                    <button
                        class="btn rename-btn"
                    >
                        ✏️
                    </button>

                    <button
                        class="btn download-btn"
                    >
                        ↓
                    </button>

                    <button
                        class="btn danger delete-btn"
                    >
                        🗑️
                    </button>

                </div>
                `;


            div.querySelector(
                ".preview-btn"
            ).onclick =
                () => {

                    previewFile(
                        file
                    );

                };


            const editButton =
                div.querySelector(
                    ".edit-btn"
                );


            if(editButton){

                editButton.onclick =
                    () => {

                        editFile(
                            file
                        );

                    };

            }


            div.querySelector(
                ".rename-btn"
            ).onclick =
                () => {

                    openRename(
                        file
                    );

                };


            div.querySelector(
                ".download-btn"
            ).onclick =
                () => {

                    downloadFile(
                        file
                    );

                };


            div.querySelector(
                ".delete-btn"
            ).onclick =
                () => {

                    deleteFile(
                        file,

                    );

                };


            box.appendChild(
                div
            );

        }
    );


    if(
        !box.children.length
    ){

        box.innerHTML =
            `
            <div class="empty">

                    search
                    ? "File tidak ditemukan."

                }

        if([
            "jpg",

        ].includes(ext)){

            $("previewContent").innerHTML = `

        /* VIDEO */

        ].includes(ext)){

            $("previewContent").innerHTML = `
                <video
                    class="preview-video"

        /* AUDIO */

/* =====================================================
BASE64 DECODE UTF-8
===================================================== */

function decodeBase64(
    value
){

    const binary =
        atob(
            value
                .replace(/\n/g,"")
        );


    const bytes =
        Uint8Array.from(
            binary,
            char =>
                char.charCodeAt(0)
        );


    try{

        return new TextDecoder(
            "utf-8"
        ).decode(
            bytes
        );

    }catch{

        return binary;

    }

}


/* =====================================================
BASE64 ENCODE UTF-8
===================================================== */

function encodeText(
    text
){

    const bytes =
        new TextEncoder()
            .encode(text);


    let binary =
        "";


    const chunk =
        0x8000;


    for(
        let i=0;
        i<bytes.length;
        i+=chunk
    ){

        binary +=
            String.fromCharCode(
                ...bytes.slice(
                    i,
                    i + chunk
                )
            );

    }


    return btoa(
        binary
    );

}


/* =====================================================
DOWNLOAD
===================================================== */

async function downloadFile(
    file
){

    try{

        showStatus(
            "... Preparing download",
            true
        );


        const data =
            await getFileData(
                file.path
            );


        const binary =
            atob(
                data.content
                    .replace(/\n/g,"")
            );


        const bytes =
            new Uint8Array(
                binary.length
            );


        for(
            let i=0;
            i<binary.length;
            i++
        ){

            bytes[i] =
                binary.charCodeAt(i);

        }


        const blob =
            new Blob(
                [bytes]
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const a =
            document.createElement(
                "a"
            );


        a.href =
            url;


        a.download =
            file.path
                .split("/")
                .pop();


        document.body.appendChild(
            a
        );


        a.click();


        a.remove();


        setTimeout(
            () => {

                URL.revokeObjectURL(
                    url
                );

            },
            1000
        );


        showStatus(
            "✓ Download dimulai.",
            true
        );


    }catch(error){

        showStatus(
            error.message,
            false
        );

    }

}

/* =====================================================
DELETE
===================================================== */

async function deleteFile(
    file,
    element
){

    if(
        !confirm(
            "Hapus file?\n\n" +
            file.path
        )
    ){

        return;

    }


    const button =
        element.querySelector(
            ".delete-btn"
        );


    button.classList.add(
        "loading"
    );

    button.textContent =
        "...";


    /*
     * Hapus langsung dari UI.
     * Jika API gagal, elemen dikembalikan.
     */

    const parent =
        element.parentNode;


    const next =
        element.nextSibling;


    element.remove();


    files =
        files.filter(
            item =>
                item.path !==
                file.path
        );


    try{

        const data =
            await getFileData(
                file.path
            );


        await github(
            `/repos/${encodeURIComponent(githubUser.login)}/${encodeURIComponent(selectedRepo.name)}/contents/${encodeURIComponent(file.path)}`,
            {

                method:"DELETE",

                body:{

                    message:
                        `Delete ${file.path}`,

                    sha:
                        data.sha,

                    branch:
                        selectedRepo.default_branch

                }

            }
        );


        showStatus(
            "✓ File dihapus.",
            true
        );


        renderFiles();


    }catch(error){

        /*
         * Restore UI kalau server gagal.
         */

        files.push(file);


        if(
            next
        ){

            parent.insertBefore(
                element,
                next
            );

        }else{

            parent.appendChild(
                element
            );

        }


        button.classList.remove(
            "loading"
        );

        button.textContent =
            "🗑️";


        showStatus(
            error.message,
            false
        );

    }

}


/* =====================================================
EDIT TEXT
===================================================== */

async function editFile(
    file
){

    selectedFile =
        file;


    $("editTitle")
        .textContent =
        "✍️ " +
        file.path;


    $("editTextarea").value =
        "Loading...";


    $("editModal")
        .classList
        .remove("hidden");


    try{

        const data =
            await getFileData(
                file.path
            );


        $("editTextarea").value =
            decodeBase64(
                data.content
            );


    }catch(error){

        closeEdit();

        showStatus(
            error.message,
            false
        );

    }

}


function closeEdit(){

    selectedFile =
        null;


    $("editModal")
        .classList
        .add("hidden");

}


$("closeEdit").onclick =
    closeEdit;

$("cancelEdit").onclick =
    closeEdit;


$("saveEdit").onclick =
    async e => {

        if(!selectedFile){

            return;

        }


        const button =
            e.currentTarget;


        button.classList.add(
            "loading"
        );

        button.textContent =
            "...";


        try{

            const data =
                await getFileData(
                    selectedFile.path
                );


            const content =
                $("editTextarea")
                    .value;


            await github(
                `/repos/${encodeURIComponent(githubUser.login)}/${encodeURIComponent(selectedRepo.name)}/contents/${encodeURIComponent(selectedFile.path)}`,
                {

                    method:"PUT",

                    body:{

                        message:
                            `Update ${selectedFile.path}`,

                        content:
                            encodeText(
                                content
                            ),

                        sha:
                            data.sha,

                        branch:
                            selectedRepo.default_branch

                    }

                }
            );


            closeEdit();


            showStatus(
                "✓ File berhasil disimpan.",
                true
            );


            await loadFiles();


        }catch(error){

            showStatus(
                error.message,
                false
            );

        }finally{

            button.classList.remove(
                "loading"
            );

            button.textContent =
                "SAVE";

        }

    };


/* =====================================================
UPLOAD
===================================================== */

$("uploadButton").onclick =
    () => {

        $("fileInput").click();

    };


$("fileInput").addEventListener(
    "change",
    async e => {

        const selected =
            [...e.target.files];


        if(!selected.length){

            return;

        }


        for(
            const file of selected
        ){

            await uploadFile(
                file
            );

        }


        e.target.value =
            "";


        await loadFiles();

    }
);


function fileToBase64(
    file
){

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const reader =
                new FileReader();


            reader.onload =
                () => {

                    resolve(
                        reader.result
                            .split(",")[1]
                    );

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );

        }
    );

}


async function uploadFile(
    file
){

    /*
     * Contents API bukan pilihan yang baik
     * untuk file sangat besar.
     */

    if(
        file.size >
        25 * 1024 * 1024
    ){

        showStatus(
            `${file.name}: maksimum 25 MB untuk mode ini.`,
            false
        );

        return;

    }


    const path =
        currentPath
        ? currentPath + "/" + file.name
        : file.name;


    showStatus(
        "... Uploading " +
        file.name,
        true
    );


    try{

        let existing =
            null;


        try{

            existing =
                await getFileData(
                    path
                );

        }catch{

            existing =
                null;

        }


        const base64 =
            await fileToBase64(
                file
            );


        const body = {

            message:
                existing
                ? `Update ${path}`
                : `Upload ${path}`,

            content:
                base64,

            branch:
                selectedRepo.default_branch

        };


        if(
            existing?.sha
        ){

            body.sha =
                existing.sha;

        }


        await github(
            `/repos/${encodeURIComponent(githubUser.login)}/${encodeURIComponent(selectedRepo.name)}/contents/${encodeURIComponent(path)}`,
            {

                method:"PUT",

                body

            }
        );


        showStatus(
            existing
            ? "✓ File ditimpa."
            : "✓ File diupload.",
            true
        );


    }catch(error){

        showStatus(
            error.message,
            false
        );

    }

}


/* =====================================================
CREATE FOLDER
===================================================== */

$("newFolderButton").onclick =
    () => {

        $("folderInput").value =
            "";

        $("folderModal")
            .classList
            .remove("hidden");

    };


function closeFolder(){

    $("folderModal")
        .classList
        .add("hidden");

}


$("closeFolder").onclick =
    closeFolder;

$("cancelFolder").onclick =
    closeFolder;


$("createFolder").onclick =
    async e => {

        const button =
            e.currentTarget;


        const name =
            $("folderInput")
                .value
                .trim()
                .replace(/^\/+/,"")
                .replace(/\/+$/,"");


        if(!name){

            showStatus(
                "Nama folder wajib diisi.",
                false
            );

            return;

        }


        /*
         * Git não possui pasta vazia.
         * Criamos .gitkeep.
         */

        const folderPath =
            currentPath
            ? currentPath + "/" + name
            : name;


        const path =
            folderPath +
            "/.gitkeep";


        button.classList.add(
            "loading"
        );

        button.textContent =
            "...";


        try{

            await github(
                `/repos/${encodeURIComponent(githubUser.login)}/${encodeURIComponent(selectedRepo.name)}/contents/${encodeURIComponent(path)}`,
                {

                    method:"PUT",

                    body:{

                        message:
                            `Create folder ${folderPath}`,

                        content:
                            encodeText(
                                ""
                            ),

                        branch:
                            selectedRepo.default_branch

                    }

                }
            );


            closeFolder();


            showStatus(
                "✓ Folder dibuat.",
                true
            );


            await loadFiles();


        }catch(error){

            showStatus(
                error.message,
                false
            );

        }finally{

            button.classList.remove(
                "loading"
            );

            button.textContent =
                "CREATE";

        }

    };

);

REFRESH

        const button =
            e.currentTarget;
